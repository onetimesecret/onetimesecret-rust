[package]
name = "onetimesecret"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Official Rust SDK for the Onetime Secret API: share self-destructing secrets via one-time links."
license = "MIT"
repository = "https://github.com/onetimesecret/onetimesecret-rust"
homepage = "https://onetimesecret.com"
documentation = "https://docs.rs/onetimesecret"
readme = "README.md"
build = "build.rs"
keywords = ["onetimesecret", "secrets", "api", "sdk", "client"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github/", "docs/", "scripts/", "deny.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls"]
# TLS backends. Exactly one should be enabled.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# A synchronous client at `onetimesecret::blocking`.
blocking = ["reqwest/blocking"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# reqwest already depends on tokio; `time` is for retry backoff.
tokio = { version = "1", default-features = false, features = ["time"] }
url = { version = "2.5", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[[example]]
name = "conceal"
required-features = ["rustls"]

[[example]]
name = "reveal"
required-features = ["rustls"]

[[example]]
name = "receipts"
required-features = ["rustls"]

[[example]]
name = "blocking"
required-features = ["rustls", "blocking"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we deliberately do not follow.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
