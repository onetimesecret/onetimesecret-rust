name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: Region (us/eu/ca/uk/nz), self-hosted version, or custom domain. Never paste credentials.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the error's Display output; it carries the request id the server logged.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: rust
