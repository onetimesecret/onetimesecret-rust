name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC (live API tests only; see the `live` job)
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  # Keyed by event too, so the scheduled live run and a push to main do not
  # cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features native-tls --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features --features native-tls
      - run: cargo test --locked --no-default-features --features rustls,blocking

  msrv:
    name: MSRV (lib)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep in sync with `rust-version` in Cargo.toml. Only the library is
      # checked: dev-dependencies may need a newer compiler.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --lib --all-features
      - run: cargo check --locked --lib --no-default-features --features native-tls

  docs:
    name: rustdoc
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --all-features --no-deps

  deny:
    name: cargo-deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  semver:
    name: semver (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # cargo-semver-checks compares the crate against its newest release on
      # crates.io and fails outright when there is none, so every pull
      # request would be red until 0.1.0 is published. Ask the registry
      # whether the crate exists and skip the check until it does.
      #
      # The registry, not the newest git tag, is the baseline because it is
      # what downstream builds resolve against, and the two can disagree:
      # docs/releasing.md publishes 0.1.0 by hand before tagging it, and a
      # tag whose publish failed would otherwise be compared against. Once
      # the crate is published this step always answers 200 and the check
      # runs unconditionally.
      #
      # crates.io's crawler policy requires a User-Agent that identifies the
      # caller; the default curl one is refused. Any answer other than 200
      # or 404 fails the job rather than guessing.
      - name: Is the crate on crates.io yet?
        id: registry
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors \
            --user-agent 'onetimesecret-rust CI (https://github.com/onetimesecret/onetimesecret-rust)' \
            "https://crates.io/api/v1/crates/$crate")"
          case "$code" in
            200) echo "published=true" >>"$GITHUB_OUTPUT" ;;
            404)
              echo "published=false" >>"$GITHUB_OUTPUT"
              echo "::notice::$crate is not on crates.io yet; skipping cargo-semver-checks"
              ;;
            *) echo "::error::crates.io answered HTTP $code for $crate"; exit 1 ;;
          esac
      - if: steps.registry.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features

  release-check:
    name: version and changelog agree
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: scripts/check-release.sh

  minimal-versions:
    name: minimal dependency versions
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Direct dependencies only: the transitive graph at its oldest does
      # not build (openssl-sys 0.9.55), and it is not ours to promise.
      - run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo check --lib --all-features

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    # Only on a schedule or when triggered manually. Never on push/PR: these
    # tests hit an external production service over the network.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      ONETIME_LIVE: "1"
      ONETIME_BASE_URL: "https://eu.onetimesecret.com"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --all-features --test live
